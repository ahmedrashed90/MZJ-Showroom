<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>MZJ Showroom Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    window.MZJ_PAGE_CACHE_BUSTER=String(Date.now());
    (function(){
      try{
        if(window.caches&&caches.keys){caches.keys().then(function(keys){return Promise.all(keys.map(function(k){return caches.delete(k);}));}).catch(function(){});}
        if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(r){try{r.unregister();}catch(e){}});}).catch(function(){});}
      }catch(e){}
    })();
    document.write('<link rel="stylesheet" href="/screen.css?v58='+encodeURIComponent(window.MZJ_PAGE_CACHE_BUSTER)+'">');
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="showroom-body">
  <div id="root" class="empty-state"><div><h1>جاري تحميل شاشة المعرض...</h1><p>يرجى الانتظار</p></div></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script>document.write('<script src="/firebase-config.js?v58='+encodeURIComponent(window.MZJ_PAGE_CACHE_BUSTER)+'"><\/script>');</script>
  <script>document.write('<script src="/screen.js?v58='+encodeURIComponent(window.MZJ_PAGE_CACHE_BUSTER)+'"><\/script>');</script>
</body>
</html>
