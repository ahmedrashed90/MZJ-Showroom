<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MZJ Showroom Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="showroom-display-body">
  <div id="root" class="empty-state"><div><h1>جاري تحميل شاشة المعرض...</h1><p>يرجى الانتظار</p></div></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    firebase.initializeApp(window.MZJ_FIREBASE_CONFIG);
    var db=firebase.firestore();

    function param(n){var u=new URL(location.href);return u.searchParams.get(n)||'';}
    function esc(s){return String(s||'').replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c];});}
    function hash(str){var h=2166136261;str=String(str||'');for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h+=(h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24);}return 'car_'+(h>>>0).toString(16);}
    function cleanText(s){return String(s||'').replace(/\s+/g,' ').trim();}
    function uniq(arr){var seen={};return (arr||[]).map(cleanText).filter(function(x){if(!x||seen[x])return false;seen[x]=1;return true;});}
    function badImage(url){url=String(url||'').toLowerCase();return /default-car|placeholder|no-image|noimage|logo|mzj-logo|favicon|icon|cropped|avatar|watermark|loader|spinner|blank/.test(url);}

    var screenId=(param('id')||'A1').toUpperCase();
    var lastCarUrl='';
    var lastForceRefresh=0;
    var data=null;
    var screenOptions={imageFilterColor:'all',imageFilterLabel:'',selectedImages:[],sliderImages:[],sliderMode:'all'};
    var displaySettings={featureFontSize:18,logoDataUrl:'',logoWidth:120,logoPosition:'right'};
    var imageIndex=0;
    var featureSection='interior';
    var imageTimer=null;
    var featureTimer=null;
    var badLoaded={};

    function empty(msg){
      clearTimers();
      var root=document.getElementById('root');
      root.className='empty-state';
      root.innerHTML='<div><h1>الشاشة '+esc(screenId)+'</h1><p>'+esc(msg||'لا توجد سيارة مرتبطة بهذه الشاشة حاليًا')+'</p></div>';
    }

    function clearTimers(){if(imageTimer)clearInterval(imageTimer);if(featureTimer)clearInterval(featureTimer);imageTimer=null;featureTimer=null;}

    function applyDisplaySettings(){
      var fs=Math.max(12,Math.min(26,parseInt(displaySettings.featureFontSize||18,10)));
      var lw=Math.max(60,Math.min(260,parseInt(displaySettings.logoWidth||120,10)));
      document.documentElement.style.setProperty('--showroom-spec-font',fs+'px');
      document.documentElement.style.setProperty('--showroom-logo-width',lw+'px');
      var logo=document.getElementById('showroomLogo');
      if(logo){
        if(displaySettings.logoDataUrl){logo.src=displaySettings.logoDataUrl;logo.classList.remove('hidden');}
        else{logo.removeAttribute('src');logo.classList.add('hidden');}
      }
      var head=document.getElementById('detailsHead');
      if(head){head.classList.toggle('logo-left',displaySettings.logoPosition==='left');head.classList.toggle('logo-right',displaySettings.logoPosition!=='left');}
    }

    function listenDisplaySettings(){
      db.collection('showroom_settings').doc('display').onSnapshot(function(doc){
        if(doc.exists){
          var d=doc.data()||{};
          displaySettings.featureFontSize=d.featureFontSize||displaySettings.featureFontSize;
          displaySettings.logoDataUrl=(d.logoDataUrl!==undefined)?d.logoDataUrl:displaySettings.logoDataUrl;
          displaySettings.logoWidth=d.logoWidth||displaySettings.logoWidth;
          displaySettings.logoPosition=d.logoPosition||d.headerPosition||displaySettings.logoPosition;
        }
        applyDisplaySettings();
        if(data)updateLogoOnly();
      },function(){applyDisplaySettings();});
    }

    function updateLogoOnly(){
      var logo=document.getElementById('showroomLogo');
      if(!logo)return;
      if(displaySettings.logoDataUrl){logo.src=displaySettings.logoDataUrl;logo.classList.remove('hidden');}
      else{logo.classList.add('hidden');logo.removeAttribute('src');}
      applyDisplaySettings();
    }

    function imagesForColor(color){
      if(!data||!color||color==='all')return[];
      var cols=[].concat(data.availableSliderColors||[],data.colors||[]),hit=null;
      cols.some(function(c){
        var vals=[c.token,c.hex,c.raw,c.external,c.label].filter(Boolean).map(function(x){return String(x).toLowerCase();});
        if(vals.indexOf(String(color).toLowerCase())>=0){hit=c;return true;}return false;
      });
      return hit&&Array.isArray(hit.images)?uniq(hit.images).filter(function(u){return !badImage(u)&&!badLoaded[u];}):[];
    }

    function images(){
      if(!data)return[];
      var manual=uniq([].concat(screenOptions.sliderImages||[],screenOptions.selectedImages||[])).filter(function(u){return !badImage(u)&&!badLoaded[u];});
      if(manual.length)return manual;
      if(screenOptions.imageFilterColor&&screenOptions.imageFilterColor!=='all'){
        var colorImgs=imagesForColor(screenOptions.imageFilterColor);
        if(colorImgs.length)return colorImgs;
      }
      return uniq([].concat(data.images||[],data.image?[data.image]:[])).filter(function(u){return !badImage(u)&&!badLoaded[u];});
    }

    function currentImage(){var arr=images();if(!arr.length)return'';if(imageIndex>=arr.length)imageIndex=0;return arr[imageIndex];}

    function externalColor(){
      var label=cleanText(screenOptions.imageFilterLabel||'').replace(/\s+-\s+\d+\s+صورة.*$/,'');
      if(screenOptions.imageFilterColor&&screenOptions.imageFilterColor!=='all'&&label&&!/اللون المحفوظ/i.test(label))return label;
      var sp=(data&&data.specs)||{};
      return sp['اللون الخارجي']||'';
    }

    function mainSpecs(sp){
      var list=[
        ['الفئة',sp['فئة السيارة']],['المحرك',sp['سعة المحرك']],['نوع الناقل',sp['نوع الناقل']],
        ['الدفع',sp['نظام الدفع']],['نوع الوقود',sp['الوقود']],['عدد المقاعد',sp['عدد المقاعد']],
        ['الحصان الميكانيكي',sp['الحصان الميكانيكي']],['استهلاك الوقود',sp['استهلاك صرفية البنزين']],['الضمان',sp['الضمان']]
      ];
      return list.filter(function(x){return cleanText(x[1]);});
    }

    function sectionData(){
      var fg=(data&&data.featureGroups)||{};
      return {
        interior:uniq(fg.interior||[]),
        exterior:uniq(fg.exterior||[]),
        safety:uniq(fg.safety||[])
      };
    }

    function sectionTitle(key){return key==='interior'?'المواصفات الداخلية':key==='exterior'?'المواصفات الخارجية':'مواصفات الأمان';}

    function validSections(){var d=sectionData();return ['interior','exterior','safety'].filter(function(k){return d[k].length;});}

    function featureHtml(){
      var groups=sectionData(),valid=validSections();
      if(!valid.length)return'';
      if(valid.indexOf(featureSection)<0)featureSection=valid[0];
      var items=(groups[featureSection]||[]).slice(0,6);
      return '<div class="showroom-section-head"><strong>تفاصيل إضافية</strong></div>'+
        '<div class="showroom-tabs">'+valid.map(function(k){return '<button class="showroom-tab '+(k===featureSection?'active':'')+'" data-section="'+k+'">'+sectionTitle(k)+'</button>';}).join('')+'</div>'+
        '<div class="showroom-features">'+items.map(function(x){return '<div class="showroom-feature"><i>✓</i><span>'+esc(x)+'</span></div>';}).join('')+'</div>';
    }

    function logoHtml(){return '<div id="detailsHead" class="showroom-details-head '+(displaySettings.logoPosition==='left'?'logo-left':'logo-right')+'"><img id="showroomLogo" class="showroom-logo '+(displaySettings.logoDataUrl?'':'hidden')+'" '+(displaySettings.logoDataUrl?'src="'+esc(displaySettings.logoDataUrl)+'"':'')+' alt="الشعار"></div>';}

    function qrHtml(){
      return '<div class="showroom-bottom"><div class="showroom-bottom-copy"><strong>تفاصيل السيارة على جوالك</strong><span>امسح الكود لفتح صفحة السيارة</span></div><div class="showroom-scan"><div><b>MZJ CARS</b><span>عرض التفاصيل الكاملة</span></div><div id="showroomQr" class="showroom-qr"></div></div></div>';
    }

    function render(){
      if(!data){empty();return;}
      clearTimers();
      var sp=data.specs||{};
      var title=data.title||'سيارة المعرض';
      var makeYear=[sp['ماركة السيارة'],sp['موديل السيارة']].filter(Boolean).join(' • ');
      var sub=[sp['فئة السيارة'],sp['سعة المحرك'],sp['نوع الناقل']].filter(Boolean).join(' — ');
      var price=data.price||sp['السعر']||'';
      var specs=mainSpecs(sp);
      var root=document.getElementById('root');
      root.className='showroom-screen';
      root.innerHTML='<section class="showroom-visual">'+
        '<div class="showroom-stage"><img id="showroomCarImage" alt="صورة السيارة"></div>'+
        '<div class="showroom-image-footer">'+(externalColor()?'<div class="showroom-color-label"><small>اللون الخارجي</small><strong>'+esc(externalColor())+'</strong></div>':'<span></span>')+'<div id="showroomDots" class="showroom-dots"></div></div>'+
      '</section>'+
      '<aside class="showroom-details">'+logoHtml()+
        (makeYear?'<div class="showroom-kicker">'+esc(makeYear)+'</div>':'')+
        '<h1>'+esc(title)+'</h1>'+(sub?'<div class="showroom-sub">'+esc(sub)+'</div>':'')+
        (price?'<div class="showroom-price-card"><small>السعر شامل ضريبة القيمة المضافة</small><div class="showroom-price">'+esc(price)+' <span>ر.س</span></div></div>':'')+
        '<div class="showroom-section-head"><strong>المواصفات الرئيسية</strong></div>'+
        '<div class="showroom-spec-grid">'+specs.map(function(x){return '<div class="showroom-spec"><small>'+esc(x[0])+'</small><strong>'+esc(x[1])+'</strong></div>';}).join('')+'</div>'+
        '<div id="showroomFeatureSlot">'+featureHtml()+'</div>'+qrHtml()+'</aside>';
      applyDisplaySettings();
      bindRendered();
      updateImageOnly();
      renderQr();
      startLoops();
    }

    function renderQr(){
      var el=document.getElementById('showroomQr');
      if(!el||!data||!data.carUrl)return;
      el.innerHTML='';
      if(window.QRCode){
        try{new QRCode(el,{text:data.carUrl,width:70,height:70,colorDark:'#201915',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}catch(e){}
      }
    }

    function renderDots(){
      var el=document.getElementById('showroomDots');if(!el)return;
      var arr=images();
      if(arr.length<2){el.innerHTML='';el.classList.add('hidden');return;}
      el.classList.remove('hidden');
      var max=Math.min(arr.length,12),current=imageIndex%arr.length;
      el.innerHTML=Array.from({length:max}).map(function(_,i){return '<span class="showroom-dot '+(i===Math.min(current,max-1)?'active':'')+'"></span>';}).join('');
    }

    function updateImageOnly(){
      var img=document.getElementById('showroomCarImage'),src=currentImage();
      if(img){
        if(src){img.src=src;img.classList.remove('hidden');}
        else{img.removeAttribute('src');img.classList.add('hidden');}
      }
      renderDots();
    }

    function updateFeaturesOnly(){var slot=document.getElementById('showroomFeatureSlot');if(slot)slot.innerHTML=featureHtml();bindTabs();}

    function bindTabs(){
      Array.prototype.slice.call(document.querySelectorAll('.showroom-tab')).forEach(function(btn){
        btn.onclick=function(e){e.stopPropagation();featureSection=btn.getAttribute('data-section')||featureSection;updateFeaturesOnly();};
      });
    }

    function bindRendered(){
      bindTabs();
      var img=document.getElementById('showroomCarImage');
      if(img)img.onerror=function(){if(this.src){badLoaded[this.src]=1;}imageIndex++;updateImageOnly();};
    }

    function startLoops(){
      imageTimer=setInterval(function(){var arr=images();if(arr.length>1){imageIndex=(imageIndex+1)%arr.length;updateImageOnly();}},6000);
      featureTimer=setInterval(function(){var valid=validSections();if(valid.length>1){var i=valid.indexOf(featureSection);featureSection=valid[(i+1+valid.length)%valid.length];updateFeaturesOnly();}},9000);
    }

    async function fetchFresh(url){
      var r=await fetch('/api/read-car?url='+encodeURIComponent(url)+'&_='+Date.now(),{cache:'no-store'});
      if(!r.ok)throw new Error('تعذر قراءة بيانات السيارة');
      var d=await r.json();
      if(d.carUrl&&url&&d.carUrl!==url){throw new Error('بيانات السيارة لا تطابق رابط الشاشة');}
      data=d;imageIndex=0;badLoaded={};featureSection='interior';render();
      db.collection('showroom_car_cache').doc(hash(url)).set(d,{merge:true}).catch(function(){});
      return d;
    }

    async function loadCar(url){
      try{await fetchFresh(url);return;}
      catch(freshError){
        try{
          var doc=await db.collection('showroom_car_cache').doc(hash(url)).get();
          var cached=doc.exists?(doc.data()||{}):null;
          if(cached&&(cached.carUrl===url||!cached.carUrl)){
            data=cached;imageIndex=0;badLoaded={};featureSection='interior';render();return;
          }
        }catch(ignore){}
        empty('تعذر تحميل بيانات السيارة وسيتم إعادة المحاولة تلقائيًا');
      }
    }

    function start(){
      db.collection('showroom_screens').doc(screenId).onSnapshot(function(doc){
        if(!doc.exists||!doc.data().carUrl){lastCarUrl='';data=null;empty();return;}
        var s=doc.data()||{};
        screenOptions.imageFilterColor=s.imageFilterColor||'all';
        screenOptions.imageFilterLabel=s.imageFilterLabel||'';
        screenOptions.selectedImages=Array.isArray(s.selectedImages)?s.selectedImages:[];
        screenOptions.sliderImages=Array.isArray(s.sliderImages)?s.sliderImages:screenOptions.selectedImages;
        screenOptions.sliderMode=s.sliderMode||(screenOptions.sliderImages.length?'manual':'all');
        var refreshToken=Number(s.forceRefresh||0);
        var carChanged=s.carUrl!==lastCarUrl;
        var forced=refreshToken!==lastForceRefresh;
        lastCarUrl=s.carUrl;lastForceRefresh=refreshToken;
        if(carChanged||!data){loadCar(s.carUrl);}
        else if(forced){fetchFresh(s.carUrl).catch(function(){updateImageOnly();});}
        else{imageIndex=0;updateImageOnly();}
      },function(){empty('جاري الاتصال وإعادة التحميل تلقائيًا');});
    }

    listenDisplaySettings();
    start();
    setInterval(function(){if(lastCarUrl)fetchFresh(lastCarUrl).catch(function(){});},10*60*1000);
  </script>
</body>
</html>
