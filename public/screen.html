<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MZJ Showroom Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="showroom-display-body">
  <div id="root" class="empty-state"><div><h1>جاري تحميل شاشة المعرض...</h1><p>يرجى الانتظار</p></div></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    firebase.initializeApp(window.MZJ_FIREBASE_CONFIG);
    var db=firebase.firestore();

    function param(n){var u=new URL(location.href);return u.searchParams.get(n)||'';}
    function esc(s){return String(s||'').replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c];});}
    function hash(str){var h=2166136261;str=String(str||'');for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h+=(h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24);}return 'car_'+(h>>>0).toString(16);}
    function cleanText(s){return String(s||'').replace(/\s+/g,' ').trim();}
    function normArabic(s){return cleanText(s).toLowerCase().replace(/[أإآ]/g,'ا').replace(/[ًٌٍَُِّْـ]/g,'').replace(/[^\u0600-\u06ff0-9a-z]+/g,' ').replace(/\s+/g,' ').trim();}
    function uniq(arr){var seen={};return (arr||[]).map(cleanText).filter(function(x){var k=normArabic(x);if(!x||seen[k])return false;seen[k]=1;return true;});}
    function badImage(url){url=String(url||'').toLowerCase();return /default-car|placeholder|no-image|noimage|logo|mzj-logo|favicon|icon|cropped|avatar|loader|spinner|blank/.test(url);}
    function normUrl(v){v=String(v||'').trim();if(!v)return'';try{var u=new URL(v,location.origin);u.hash='';var p=u.pathname.replace(/\/{2,}/g,'/');if(p.length>1)p=p.replace(/\/+$/,'');return (u.origin.toLowerCase()+p+u.search).toLowerCase();}catch(e){return v.replace(/\/+$/,'').toLowerCase();}}

    var screenId=(param('id')||'A1').toUpperCase();
    var lastVehicleKey='';
    var lastForceRefresh=0;
    var data=null;
    var screenOptions={carId:'',carUrl:'',carName:'',carPrice:'',imageFilterColor:'all',imageFilterLabel:'',selectedImages:[],sliderImages:[],sliderMode:'all'};
    var displaySettings={featureFontSize:18,logoDataUrl:'',logoWidth:120,logoPosition:'right'};
    var imageIndex=0;
    var techIndex=0;
    var featureSection='interior';
    var imageTimer=null;
    var techTimer=null;
    var featureTimer=null;
    var badLoaded={};

    function empty(msg){
      clearTimers();
      var root=document.getElementById('root');
      root.className='empty-state';
      root.innerHTML='<div><h1>الشاشة '+esc(screenId)+'</h1><p>'+esc(msg||'لا توجد سيارة مرتبطة بهذه الشاشة حاليًا')+'</p></div>';
    }

    function clearTimers(){
      if(imageTimer)clearInterval(imageTimer);
      if(techTimer)clearInterval(techTimer);
      if(featureTimer)clearInterval(featureTimer);
      imageTimer=techTimer=featureTimer=null;
    }

    function applyDisplaySettings(){
      var fs=Math.max(12,Math.min(26,parseInt(displaySettings.featureFontSize||18,10)));
      var lw=Math.max(60,Math.min(260,parseInt(displaySettings.logoWidth||120,10)));
      document.documentElement.style.setProperty('--showroom-spec-font',fs+'px');
      document.documentElement.style.setProperty('--showroom-logo-width',lw+'px');
      var logo=document.getElementById('showroomLogo');
      if(logo){
        if(displaySettings.logoDataUrl){logo.src=displaySettings.logoDataUrl;logo.classList.remove('hidden');}
        else{logo.removeAttribute('src');logo.classList.add('hidden');}
      }
      var head=document.getElementById('detailsHead');
      if(head){head.classList.toggle('logo-left',displaySettings.logoPosition==='left');head.classList.toggle('logo-right',displaySettings.logoPosition!=='left');}
    }

    function listenDisplaySettings(){
      db.collection('showroom_settings').doc('display').onSnapshot(function(doc){
        if(doc.exists){
          var d=doc.data()||{};
          displaySettings.featureFontSize=d.featureFontSize||displaySettings.featureFontSize;
          displaySettings.logoDataUrl=(d.logoDataUrl!==undefined)?d.logoDataUrl:displaySettings.logoDataUrl;
          displaySettings.logoWidth=d.logoWidth||displaySettings.logoWidth;
          displaySettings.logoPosition=d.logoPosition||d.headerPosition||displaySettings.logoPosition;
        }
        applyDisplaySettings();
      },function(){applyDisplaySettings();});
    }

    function imagesForColor(color){
      if(!data||!color||color==='all')return[];
      var cols=[].concat(data.availableSliderColors||[],data.colors||[]),hit=null;
      cols.some(function(c){
        var vals=[c.token,c.hex,c.raw,c.external,c.label].filter(Boolean).map(function(x){return String(x).toLowerCase();});
        if(vals.indexOf(String(color).toLowerCase())>=0){hit=c;return true;}return false;
      });
      return hit&&Array.isArray(hit.images)?uniq(hit.images).filter(function(u){return !badImage(u)&&!badLoaded[u];}):[];
    }

    function images(){
      if(!data)return[];
      var manual=uniq([].concat(screenOptions.sliderImages||[],screenOptions.selectedImages||[])).filter(function(u){return !badImage(u)&&!badLoaded[u];});
      if(manual.length)return manual;
      if(screenOptions.imageFilterColor&&screenOptions.imageFilterColor!=='all'){
        var colorImgs=imagesForColor(screenOptions.imageFilterColor);
        if(colorImgs.length)return colorImgs;
      }
      return uniq([].concat(data.images||[],data.image?[data.image]:[])).filter(function(u){return !badImage(u)&&!badLoaded[u];});
    }

    function currentImage(){var arr=images();if(!arr.length)return'';if(imageIndex>=arr.length)imageIndex=0;return arr[imageIndex];}

    function externalColor(){
      var label=cleanText(screenOptions.imageFilterLabel||'').replace(/\s+-\s+\d+\s+صورة.*$/,'');
      if(screenOptions.imageFilterColor&&screenOptions.imageFilterColor!=='all'&&label&&!/اللون المحفوظ/i.test(label))return label;
      var sp=(data&&data.specs)||{};
      return sp['اللون الخارجي']||'';
    }

    function semanticSpecKey(label){
      var n=normArabic(label);
      var map={
        'سعة المحرك':'engine','المحرك':'engine',
        'ناقل الحركة':'transmission','نوع الناقل':'transmission',
        'الدفع':'drive','نظام الدفع':'drive',
        'نوع الوقود':'fuel','الوقود':'fuel',
        'عدد المقاعد':'seats',
        'الموديل':'year','السنة':'year','موديل السيارة':'year',
        'نوع الهيكل':'body','الهيكل':'body','هيكل السيارة':'body',
        'الفئة':'trim','فئة السيارة':'trim',
        'استهلاك الوقود':'fuel economy','استهلاك صرفية البنزين':'fuel economy',
        'الضمان':'warranty','عدد السرعات':'gears','الحصان الميكانيكي':'hp','عزم نيوتن':'torque',
        'السرعة القصوى':'max speed','عدد السلندرات':'cylinders','الطول مم':'length','العرض مم':'width','الارتفاع مم':'height',
        'قاعدة العجلات مم':'wheelbase','حجم الشنطة مم':'trunk','حجم الشنطة':'trunk'
      };
      return map[n]||n;
    }

    function fallbackQuickSpecs(){
      var sp=(data&&data.specs)||{};
      return [
        {label:'الفئة',value:sp['فئة السيارة']},{label:'سعة المحرك',value:sp['سعة المحرك']},{label:'نوع الهيكل',value:sp['هيكل السيارة']},
        {label:'الموديل',value:sp['موديل السيارة']},{label:'الدفع',value:sp['نظام الدفع']},{label:'ناقل الحركة',value:sp['نوع الناقل']},
        {label:'عدد المقاعد',value:sp['عدد المقاعد']},{label:'نوع الوقود',value:sp['الوقود']},{label:'الضمان',value:sp['الضمان']}
      ].filter(function(x){return cleanText(x.value);});
    }

    function mainSpecs(){
      var src=(Array.isArray(data&&data.quickSpecs)&&data.quickSpecs.length)?data.quickSpecs:fallbackQuickSpecs();
      var seen={},out=[];
      src.forEach(function(x){
        var label=cleanText(x.label),value=cleanText(x.value),key=semanticSpecKey(label);
        if(!label||!value||value==='—'||seen[key])return;
        seen[key]=1;out.push([label,value,key]);
      });
      return out;
    }

    function fallbackSpecGroups(){
      var sp=(data&&data.specs)||{};
      return [
        {title:'ناقل الحركة',items:[['نوع الناقل',sp['نوع الناقل']],['عدد السرعات',sp['عدد السرعات']],['الدفع',sp['نظام الدفع']],['نوع الوقود',sp['الوقود']],['استهلاك الوقود',sp['استهلاك صرفية البنزين']]]},
        {title:'المحرك والأداء',items:[['المحرك',sp['سعة المحرك']],['الحصان الميكانيكي',sp['الحصان الميكانيكي']],['عزم نيوتن',sp['عزم نيوتن']],['السرعة القصوى',sp['السرعة القصوى']],['عدد السلندرات',sp['عدد السلندرات']]]},
        {title:'الأبعاد والأوزان',items:[['الطول مم',sp['الطول الكلي (مم)']],['العرض مم',sp['العرض الكلي (مم)']],['الارتفاع مم',sp['الارتفاع الكلي (مم)']],['قاعدة العجلات مم',sp['قاعدة العجلات (مم)']],['حجم الشنطة مم',sp['حجم الشنطة']],['عدد المقاعد',sp['عدد المقاعد']]]}
      ].map(function(g){return {title:g.title,items:g.items.filter(function(x){return cleanText(x[1]);}).map(function(x){return {label:x[0],value:x[1]};})};}).filter(function(g){return g.items.length;});
    }

    function technicalGroups(){
      var main=mainSpecs(),seen={};main.forEach(function(x){seen[x[2]]=1;});
      var src=(Array.isArray(data&&data.specGroups)&&data.specGroups.length)?data.specGroups:fallbackSpecGroups();
      var groups=[];
      src.forEach(function(g){
        var items=[];
        (g.items||[]).forEach(function(x){
          var label=cleanText(x.label),value=cleanText(x.value),key=semanticSpecKey(label);
          if(!label||!value||value==='—'||seen[key])return;
          seen[key]=1;items.push([label,value,key]);
        });
        if(items.length)groups.push({title:cleanText(g.title),items:items});
      });
      return groups;
    }

    function sectionData(){
      var fg=(data&&data.featureGroups)||{},seen={};
      var result={interior:[],exterior:[],safety:[]};
      ['interior','exterior','safety'].forEach(function(k){
        (fg[k]||[]).forEach(function(item){
          var text=cleanText(item),key=normArabic(text);
          if(!text||seen[key])return;
          seen[key]=1;result[k].push(text);
        });
      });
      return result;
    }

    function sectionTitle(key){return key==='interior'?'المواصفات الداخلية':key==='exterior'?'المواصفات الخارجية':'مواصفات الأمان';}
    function validSections(){var d=sectionData();return ['interior','exterior','safety'].filter(function(k){return d[k].length;});}

    function techHtml(){
      var groups=technicalGroups();
      if(!groups.length)return'';
      if(techIndex>=groups.length)techIndex=0;
      var g=groups[techIndex];
      return '<div class="showroom-section-head showroom-compact-head"><strong>المواصفات الفنية</strong></div>'+
        '<div class="showroom-tech-tabs">'+groups.map(function(x,i){return '<button class="showroom-tech-tab '+(i===techIndex?'active':'')+'" data-tech="'+i+'">'+esc(x.title)+'</button>';}).join('')+'</div>'+
        '<div class="showroom-tech-grid">'+g.items.map(function(x){return '<div class="showroom-tech-spec"><small>'+esc(x[0])+'</small><strong>'+esc(x[1])+'</strong></div>';}).join('')+'</div>';
    }

    function featureLayoutClass(count){
      if(count>24)return 'feature-cols-4 feature-very-dense';
      if(count>16)return 'feature-cols-4 feature-dense';
      if(count>10)return 'feature-cols-3 feature-dense';
      return 'feature-cols-2';
    }

    function featureHtml(){
      var groups=sectionData(),valid=validSections();
      if(!valid.length)return'';
      if(valid.indexOf(featureSection)<0){featureSection=valid[0];}
      var items=groups[featureSection]||[];
      var layout=featureLayoutClass(items.length);
      return '<div class="showroom-section-head showroom-compact-head"><strong>المواصفات</strong></div>'+ 
        '<div class="showroom-tabs">'+valid.map(function(k){return '<button class="showroom-tab '+(k===featureSection?'active':'')+'" data-section="'+k+'">'+sectionTitle(k)+'</button>';}).join('')+'</div>'+ 
        '<div class="showroom-features '+layout+'">'+items.map(function(x){return '<div class="showroom-feature"><i>✓</i><span>'+esc(x)+'</span></div>';}).join('')+'</div>';
    }

    function logoHtml(){return '<div id="detailsHead" class="showroom-details-head '+(displaySettings.logoPosition==='left'?'logo-left':'logo-right')+'"><img id="showroomLogo" class="showroom-logo '+(displaySettings.logoDataUrl?'':'hidden')+'" '+(displaySettings.logoDataUrl?'src="'+esc(displaySettings.logoDataUrl)+'"':'')+' alt="الشعار"></div>';}
    function qrHtml(){return '<div class="showroom-bottom"><div class="showroom-bottom-copy"><strong>تفاصيل السيارة على جوالك</strong><span>امسح الكود لفتح نفس السيارة</span></div><div class="showroom-scan"><div><b>MZJ CARS</b><span>عرض التفاصيل الكاملة</span></div><div id="showroomQr" class="showroom-qr"></div></div></div>';}

    function render(){
      if(!data){empty();return;}
      clearTimers();
      var sp=data.specs||{};
      var title=cleanText(data.title||screenOptions.carName||'');
      var makeYear=[sp['ماركة السيارة'],sp['موديل السيارة']].filter(Boolean).join(' • ');
      var price=data.price||screenOptions.carPrice||sp['السعر']||'';
      var specs=mainSpecs();
      var root=document.getElementById('root');
      root.className='showroom-screen';
      root.innerHTML='<section class="showroom-visual">'+
        '<div class="showroom-stage"><img id="showroomCarImage" alt="'+esc(title||'صورة السيارة')+'"></div>'+
        '<div class="showroom-image-footer">'+(externalColor()?'<div class="showroom-color-label"><small>اللون الخارجي</small><strong>'+esc(externalColor())+'</strong></div>':'<span></span>')+'<div id="showroomDots" class="showroom-dots"></div></div>'+
      '</section>'+
      '<aside class="showroom-details">'+logoHtml()+
        (makeYear?'<div class="showroom-kicker">'+esc(makeYear)+'</div>':'')+
        (title?'<h1>'+esc(title)+'</h1>':'')+
        (price?'<div class="showroom-price-card"><small>السعر شامل ضريبة القيمة المضافة</small><div class="showroom-price">'+esc(price)+' <span>ر.س</span></div></div>':'')+
        (specs.length?'<div class="showroom-section-head"><strong>المواصفات الرئيسية</strong></div><div class="showroom-spec-grid">'+specs.map(function(x){return '<div class="showroom-spec"><small>'+esc(x[0])+'</small><strong>'+esc(x[1])+'</strong></div>';}).join('')+'</div>':'')+
        '<div id="showroomTechSlot">'+techHtml()+'</div>'+
        '<div id="showroomFeatureSlot">'+featureHtml()+'</div>'+qrHtml()+'</aside>';
      applyDisplaySettings();
      bindRendered();
      updateImageOnly();
      renderQr();
      startLoops();
    }

    function renderQr(){
      var el=document.getElementById('showroomQr'),url=screenOptions.carUrl||(data&&data.carUrl)||'';
      if(!el||!url)return;
      el.innerHTML='';
      if(window.QRCode){try{new QRCode(el,{text:url,width:70,height:70,colorDark:'#201915',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}catch(e){}}
    }

    function renderDots(){
      var el=document.getElementById('showroomDots');if(!el)return;
      var arr=images();
      if(arr.length<2){el.innerHTML='';el.classList.add('hidden');return;}
      el.classList.remove('hidden');
      var max=Math.min(arr.length,12),current=imageIndex%arr.length;
      el.innerHTML=Array.from({length:max}).map(function(_,i){return '<span class="showroom-dot '+(i===Math.min(current,max-1)?'active':'')+'"></span>';}).join('');
    }

    function updateImageOnly(){
      var img=document.getElementById('showroomCarImage'),src=currentImage();
      if(img){if(src){img.src=src;img.classList.remove('hidden');}else{img.removeAttribute('src');img.classList.add('hidden');}}
      renderDots();
    }

    function updateTechOnly(){var slot=document.getElementById('showroomTechSlot');if(slot)slot.innerHTML=techHtml();bindTechTabs();}
    function updateFeaturesOnly(){var slot=document.getElementById('showroomFeatureSlot');if(slot)slot.innerHTML=featureHtml();bindFeatureTabs();}

    function bindTechTabs(){
      Array.prototype.slice.call(document.querySelectorAll('.showroom-tech-tab')).forEach(function(btn){btn.onclick=function(e){e.stopPropagation();techIndex=parseInt(btn.getAttribute('data-tech')||'0',10)||0;updateTechOnly();};});
    }
    function bindFeatureTabs(){
      Array.prototype.slice.call(document.querySelectorAll('.showroom-tab')).forEach(function(btn){btn.onclick=function(e){e.stopPropagation();featureSection=btn.getAttribute('data-section')||featureSection;updateFeaturesOnly();};});
    }
    function bindRendered(){
      bindTechTabs();bindFeatureTabs();
      var img=document.getElementById('showroomCarImage');
      if(img)img.onerror=function(){if(this.src)badLoaded[this.src]=1;imageIndex++;updateImageOnly();};
    }

    function advanceFeature(){
      var valid=validSections();if(valid.length<2)return;
      if(valid.indexOf(featureSection)<0){featureSection=valid[0];}
      else{var i=valid.indexOf(featureSection);featureSection=valid[(i+1)%valid.length];}
      updateFeaturesOnly();
    }

    function startLoops(){
      imageTimer=setInterval(function(){var arr=images();if(arr.length>1){imageIndex=(imageIndex+1)%arr.length;updateImageOnly();}},6000);
      techTimer=setInterval(function(){var groups=technicalGroups();if(groups.length>1){techIndex=(techIndex+1)%groups.length;updateTechOnly();}},8000);
      featureTimer=setInterval(advanceFeature,12000);
    }

    function cacheKey(){return screenOptions.carId?hash('id:'+screenOptions.carId):hash(screenOptions.carUrl);}

    async function fetchFresh(){
      var identifier=screenOptions.carId||screenOptions.carUrl;
      if(!identifier)throw new Error('لا يوجد ID للسيارة');
      var r=await fetch('/api/read-car?id='+encodeURIComponent(identifier)+'&_='+Date.now(),{cache:'no-store'});
      var d=await r.json().catch(function(){return{};});
      if(!r.ok)throw new Error(d.error||'تعذر قراءة بيانات السيارة');
      if(screenOptions.carId&&String(d.id||'')!==String(screenOptions.carId))throw new Error('بيانات السيارة لا تطابق ID الشاشة');
      if(screenOptions.carUrl&&d.carUrl&&normUrl(d.carUrl)!==normUrl(screenOptions.carUrl))throw new Error('بيانات السيارة لا تطابق رابط الشاشة');
      data=d;imageIndex=0;badLoaded={};techIndex=0;featureSection='interior';render();
      db.collection('showroom_car_cache').doc(cacheKey()).set(d,{merge:true}).catch(function(){});
      return d;
    }

    async function loadCar(){
      try{await fetchFresh();return;}
      catch(freshError){
        try{
          var doc=await db.collection('showroom_car_cache').doc(cacheKey()).get();
          var cached=doc.exists?(doc.data()||{}):null;
          if(cached&&(!screenOptions.carId||String(cached.id||'')===String(screenOptions.carId))&&(!screenOptions.carUrl||!cached.carUrl||normUrl(cached.carUrl)===normUrl(screenOptions.carUrl))){
            data=cached;imageIndex=0;badLoaded={};techIndex=0;featureSection='interior';render();return;
          }
        }catch(ignore){}
        empty('تعذر تحميل بيانات نفس السيارة وسيتم إعادة المحاولة تلقائيًا');
      }
    }

    function start(){
      db.collection('showroom_screens').doc(screenId).onSnapshot(function(doc){
        if(!doc.exists){lastVehicleKey='';data=null;empty();return;}
        var s=doc.data()||{};
        if(!s.carUrl&&!s.carId){lastVehicleKey='';data=null;empty();return;}
        screenOptions.carId=String(s.carId||'');
        screenOptions.carUrl=String(s.carUrl||'');
        screenOptions.carName=String(s.carName||'');
        screenOptions.carPrice=String(s.carPrice||'');
        screenOptions.imageFilterColor=s.imageFilterColor||'all';
        screenOptions.imageFilterLabel=s.imageFilterLabel||'';
        screenOptions.selectedImages=Array.isArray(s.selectedImages)?s.selectedImages:[];
        screenOptions.sliderImages=Array.isArray(s.sliderImages)?s.sliderImages:screenOptions.selectedImages;
        screenOptions.sliderMode=s.sliderMode||(screenOptions.sliderImages.length?'manual':'all');
        var refreshToken=Number(s.forceRefresh||0);
        var vehicleKey=screenOptions.carId||normUrl(screenOptions.carUrl);
        var carChanged=vehicleKey!==lastVehicleKey;
        var forced=refreshToken!==lastForceRefresh;
        lastVehicleKey=vehicleKey;lastForceRefresh=refreshToken;
        if(carChanged||!data)loadCar();
        else if(forced)fetchFresh().catch(function(){updateImageOnly();renderQr();});
        else{imageIndex=0;updateImageOnly();renderQr();}
      },function(){empty('جاري الاتصال وإعادة التحميل تلقائيًا');});
    }

    listenDisplaySettings();
    start();
    setInterval(function(){if(lastVehicleKey)fetchFresh().catch(function(){});},10*60*1000);
  </script>
</body>
</html>
